# Render blueprint — deploy the agent as a free web service.
# After deploy, set GEMINI_API_KEY and CASPIAN_API_KEY (and optionally
# TELEGRAM_BOT_TOKEN / DISCORD_BOT_TOKEN) in the service's Environment tab.
services:
  - type: web
    name: kisan-mitra
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AGENT_EMAIL_USERNAME
        value: kisan-mitra
      - key: GEMINI_API_KEY
        sync: false
      - key: CASPIAN_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
