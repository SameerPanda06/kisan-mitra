name: Keep Kisan Mitra Alive

# Render free tier sleeps the service after 15 min idle, which would stall
# replies. This pings /health roughly every 13 min so the agent stays warm.
# Update the URL after the first Render deploy (your-app.onrender.com).

on:
  schedule:
    - cron: "3-59/13 * * * *"  # off-minute, <15 min apart
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Kisan Mitra
        run: >
          curl -s -o /dev/null -w "health: %{http_code} in %{time_total}s\n"
          --max-time 90
          "https://kisan-mitra.onrender.com/health"
